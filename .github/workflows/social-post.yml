name: Social Post (X)

# Depois de cada rodada do robô de notícias, divulga no X a matéria que merece (nota 4 ou 5, saiu há pouco).
# Chave de desligar: variável do repositório SOCIAL_MODE = off | check | dry-run | auto (sem a variável, fica off).
on:
  workflow_run:
    workflows: ["Fetch Vasco News"]
    types: [completed]
  workflow_dispatch:

# nunca duas rodadas ao mesmo tempo (evita post em dobro)
concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: master

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Post
        env:
          SOCIAL_MODE: ${{ vars.SOCIAL_MODE || 'off' }}
          X_POST_API_KEY: ${{ secrets.X_POST_API_KEY }}
          X_POST_API_SECRET: ${{ secrets.X_POST_API_SECRET }}
          X_POST_ACCESS_TOKEN: ${{ secrets.X_POST_ACCESS_TOKEN }}
          X_POST_ACCESS_SECRET: ${{ secrets.X_POST_ACCESS_SECRET }}
        run: python scripts/social_post.py

      # o estado (o que já foi publicado) é guardado mesmo se a etapa acima falhar depois de postar
      - name: Save state
        if: always()
        run: |
          git config user.name  "vascainamente-bot"
          git config user.email "bot@vascainamente.com.br"
          git add .social_state.json
          git diff --staged --quiet && exit 0
          git commit -q -m "chore(social): estado do postador $(date +'%d/%m %H:%M')"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -q && git push -q && exit 0
            sleep $((attempt * 3))
          done
          echo "ERRO: não foi possível salvar o estado do postador"
          exit 1
