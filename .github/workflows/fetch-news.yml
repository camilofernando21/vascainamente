name: Fetch Vasco News

on:
  # GitHub runs scheduled workflows on a best-effort basis (in practice every 4 to 7 hours here).
  # The real 15-minute cadence comes from an external trigger (cron-job.org) calling
  # workflow_dispatch; this schedule stays only as a fallback if that trigger stops.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:           # external trigger every 15 min + manual runs

# never two runs at once (the external trigger and the schedule can coincide):
# a new run waits for the current one instead of racing it on the same files
concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch and publish news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # beat reporters on X: off while the secret is empty (paid API, see scripts/x_source.py)
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_MONTHLY_POST_LIMIT: ${{ vars.X_MONTHLY_POST_LIMIT }}
        run: python scripts/fetch-news.py

      - name: Commit new articles
        run: |
          git config user.name  "vascainamente-bot"
          git config user.email "bot@vascainamente.com.br"
          git add content/noticias/ .news_cache.json $(ls .x_state.json 2>/dev/null)
          git diff --staged --quiet && exit 0
          git commit -m "feat(news): $(date +'%d/%m %H:%M') — novas notícias do Vasco"
          # someone (or the reclassify workflow) may have pushed meanwhile
          git pull --rebase
          git push
